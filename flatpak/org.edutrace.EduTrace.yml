app-id: org.edutrace.EduTrace
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: EduTrace
finish-args:
  - --share=ipc
modules:
  - name: libsodium
    buildsystem: autotools
    sources:
      - type: archive
        url: https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz
        sha256: REPLACE_WITH_VERIFIED_UPSTREAM_SHA256
  - name: edutrace
    buildsystem: cmake-ninja
    config-opts: [-DCMAKE_BUILD_TYPE=Release]
    sources:
      - type: dir
        path: ..
