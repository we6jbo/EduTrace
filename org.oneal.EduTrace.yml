app-id: org.oneal.EduTrace
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: EduTrace
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
modules:
  - name: libsodium
    buildsystem: autotools
    sources:
      - type: archive
        url: https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz
        sha256: REPLACE_WITH_VERIFIED_UPSTREAM_SHA256
  - name: EduTrace
    buildsystem: cmake-ninja
    sources:
      - type: dir
        path: .
